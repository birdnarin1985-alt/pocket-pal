<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel 3D Renderer - Thai</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #f0f0f0;
    }

    #scene {
      perspective: 600;
      camera {
        position: 0;
        z: 0;
      }
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }

    .voxel {
      position: 50%;
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      transform: scale(1.2);
    }

    .light {
      position: 50%;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
  </style>
</head>
<body>

  <div id="scene"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@latest/dist/three.min.js"></script>
  <script>
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1);
    var light = new THREE.PointLight(0);

    for (let i = 0; i < 1000; i++) {
      var voxel = new THREE.Box();
      voxel.position.set(i * 100, 0, 0);
      voxel.color.set(1, 0, 0, 1);
      voxel.size = 1;
      scene.add(voxel);

      camera.position.c = 0;
      camera.lookAt(0, 0, 0);
    }

    light.position.set(0, 0, 10);
    light.step(-1, 1, 1);

    scene.intersectObjects(camera);

    camera.position.z = 5;

    scene.render();
  </script>

</body>
</html>
